on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano_v2
            shield: lily58_left
          - board: nice_nano_v2
            shield: lily58_right
          - board: nice_nano
            shield: settings_reset

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-west-${{ hashFiles('config/west.yml') }}

      - name: West init
        run: west init -l config

      - name: West update
        run: west update

      - name: West zephyr-export
        run: west zephyr-export

      - name: Build
        run: |
          build_dir="build/${{ matrix.shield }}-${{ matrix.board }}"
          west build --pristine -s zmk/app -d "${build_dir}" -b "${{ matrix.board }}" -- \
            -DSHIELD=${{ matrix.shield }} \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Show chain-length used
        if: always()
        run: |
          build_dir="build/${{ matrix.shield }}-${{ matrix.board }}"
          echo "=== ${build_dir}/zephyr/zephyr.dts : chain-length ==="
          grep -n "chain-length" "${build_dir}/zephyr/zephyr.dts" || true
          echo "=== ${build_dir}/zephyr/zephyr.dts : zmk,underglow ==="
          grep -n "zmk,underglow" "${build_dir}/zephyr/zephyr.dts" || true

      - name: Copy UF2
        if: success()
        run: |
          build_dir="build/${{ matrix.shield }}-${{ matrix.board }}"
          cp "${build_dir}/zephyr/zmk.uf2" "${{ matrix.shield }}-${{ matrix.board }}.uf2"

      - name: Upload UF2
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.shield }}-${{ matrix.board }}
          path: ${{ matrix.shield }}-${{ matrix.board }}.uf2

      - name: Upload zephyr.dts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dts-${{ matrix.shield }}-${{ matrix.board }}
          path: build/${{ matrix.shield }}-${{ matrix.board }}/zephyr/zephyr.dts
