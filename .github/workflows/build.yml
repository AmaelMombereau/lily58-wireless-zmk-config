on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano
            shield: lily58_left
          - board: nice_nano
            shield: lily58_right
          - board: nice_nano
            shield: settings_reset

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-west-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-west-

      - name: West init
        run: west init -l config

      - name: West update
        run: west update

      - name: West zephyr-export
        run: west zephyr-export

      - name: Build
        run: |
          west build -s zmk/app -b ${{ matrix.board }} -- -DSHIELD=${{ matrix.shield }} -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Show overlays used (source of truth)
        run: |
          echo "=== DTC_OVERLAY_FILE ==="
          grep -RIn "DTC_OVERLAY_FILE" build/CMakeCache.txt || true

          echo "=== Shield/Board in CMakeCache ==="
          grep -RInE "^(BOARD|SHIELD)(:|=)" build/CMakeCache.txt || true

          echo "=== Overlay / DTS / Keymap paths referenced ==="
          grep -RInE "(overlay|\\.overlay|zephyr\\.dts|\\.keymap)" build/CMakeCache.txt || true

      - name: Show LED devicetree values
        run: |
          echo "=== Extract LED bits from zephyr.dts ==="
          grep -n "zmk,underglow" build/zephyr/zephyr.dts || true
          grep -n "ws2812" build/zephyr/zephyr.dts || true
          grep -n "chain-length" build/zephyr/zephyr.dts || true

      - name: Show overlays actually used
        run: |
          echo "=== dts.cmake (overlay list) ==="
          sed -n '1,200p' build/zephyr/dts.cmake || true

          echo "=== Search overlay filenames in build dir ==="
          grep -RIn "overlay" build/zephyr/dts.cmake build/CMakeCache.txt || true

          echo "=== Look for lily58 / nice_nano overlays ==="
          grep -RIn "lily58_.*\.overlay|nice_nano.*\.overlay" build/zephyr/dts.cmake build/CMakeCache.txt || true
      - name: Show led_strip node block
        run: |
          echo "=== led_strip block ==="
          awk 'BEGIN{p=0}
               /led_strip: ws2812@0/{p=1}
               p{print}
               p && /};/{exit}' build/zephyr/zephyr.dts


      - name: Copy UF2
        run: cp build/zephyr/zmk.uf2 ${{ matrix.shield }}-${{ matrix.board }}.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.shield }}-${{ matrix.board }}
          path: ${{ matrix.shield }}-${{ matrix.board }}.uf2
