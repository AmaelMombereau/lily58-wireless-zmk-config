on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano
            shield: lily58_left
          - board: nice_nano
            shield: lily58_right
          - board: nice_nano
            shield: settings_reset

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-west-${{ hashFiles('config/west.yml') }}

      - name: West init
        run: west init -l config

      - name: West update
        run: west update

      - name: West zephyr-export
        run: west zephyr-export

      - name: Build (${{ matrix.shield }} - ${{ matrix.board }})
        run: |
          build_dir="build/${{ matrix.shield }}-${{ matrix.board }}"
          west build --pristine -s zmk/app -d "${build_dir}" -b "${{ matrix.board }}" -- \
            -DSHIELD=${{ matrix.shield }} \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Show overlays + LED devicetree values
        run: |
          build_dir="build/${{ matrix.shield }}-${{ matrix.board }}"

          echo "=== BOARD / SHIELD (CMakeCache) ==="
          grep -nE '^(BOARD|SHIELD):' "${build_dir}/CMakeCache.txt" || true

          echo "=== DTC_OVERLAY_FILE / KEYMAP_FILE (CMakeCache) ==="
          grep -nE '^(DTC_OVERLAY_FILE|KEYMAP_FILE):' "${build_dir}/CMakeCache.txt" || true

          echo "=== dts.cmake (chosen underglow path) ==="
          grep -n "zmk,underglow" "${build_dir}/zephyr/dts.cmake" || true

          echo "=== zephyr.dts (led_strip block) ==="
          awk '
            /led_strip: ws2812@0/ {p=1}
            p {print}
            p && /};/ {exit}
          ' "${build_dir}/zephyr/zephyr.dts" || true

          echo "=== zephyr.dts quick greps ==="
          grep -n "zmk,underglow" "${build_dir}/zephyr/zephyr.dts" || true
          grep -n "chain-length" "${build_dir}/zephyr/zephyr.dts" || true

      - name: Copy UF2
        run: |
          build_dir="build/${{ matrix.shield }}-${{ matrix.board }}"
          cp "${build_dir}/zephyr/zmk.uf2" "${{ matrix.shield }}-${{ matrix.board }}.uf2"

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.shield }}-${{ matrix.board }}
          path: ${{ matrix.shield }}-${{ matrix.board }}.uf2
