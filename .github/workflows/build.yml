name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python deps (west + pyelftools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install west pyelftools

      - name: West init/update/export
        run: |
          python -m west init -l config
          python -m west update
          python -m west zephyr-export

      - name: Build LEFT
        run: |
          build_dir="build/corne_left-nice_nano_v2"
          python -m west build --pristine -s zmk/app -d "${build_dir}" -b nice_nano_v2 -- \
            -DSHIELD=corne_left \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Build RIGHT
        run: |
          build_dir="build/corne_right-nice_nano_v2"
          python -m west build --pristine -s zmk/app -d "${build_dir}" -b nice_nano_v2 -- \
            -DSHIELD=corne_right \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Show DTS contexts + diff
        if: always()
        run: |
          left="build/corne_left-nice_nano_v2/zephyr/nice_nano_v2.dts.pre.tmp"
          right="build/corne_right-nice_nano_v2/zephyr/nice_nano_v2.dts.pre.tmp"

          echo "=== LEFT context ==="
          [ -f "${left}" ] && sed -n '860,890p' "${left}" || echo "LEFT pre.tmp missing"

          echo "=== RIGHT context ==="
          [ -f "${right}" ] && sed -n '860,890p' "${right}" || echo "RIGHT pre.tmp missing"

          echo "=== DIFF (first 200 lines) ==="
          if [ -f "${left}" ] && [ -f "${right}" ]; then
            diff -u "${left}" "${right}" | sed -n '1,200p' || true
          fi
